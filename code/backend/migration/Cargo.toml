[package]
name = "migration"
version = "0.1.0"
description = "Falcon AI database migrations (SeaORM)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# SeaORM convention: a library (the Migrator, used by falcon-api at startup)
# plus src/main.rs, the CLI that `sea-orm-cli migrate ...` drives.
[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
sea-orm-migration.workspace = true
tokio.workspace = true

[lints]
workspace = true
