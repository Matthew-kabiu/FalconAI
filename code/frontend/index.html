<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Falcon AI — farm management for small-scale farmers." />
    <meta name="theme-color" content="#007200" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#004b23" media="(prefers-color-scheme: dark)" />
    <title>Falcon AI</title>
    <!-- Apply a saved Light/Dark choice before first paint, so the page never flashes the wrong theme. -->
    <script>
      try {
        var theme = localStorage.getItem('falcon.theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
