# Production serving for the Falcon AI SPA.
# Vite-Build-Template §11.3 → Backend-Build-Template §10.1 config, verbatim.
# CSP connect-src allows 'self' and any https: origin, which covers the backend
# at VITE_API_BASE_URL in staging/production (the API origin is baked into the
# bundle at build time; Nginx cannot read Vite env).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Clerk (SOP addendum, Vite §9) — only the sources Clerk's CSP guide lists
    # (clerk.com/docs/guides/secure/best-practices/csp-headers):
    #   Frontend API (FAPI) host in script-src + connect-src: development instances use
    #   https://*.clerk.accounts.dev; ADD the production instance's FAPI host
    #   (https://clerk.<your-domain>) here when the production Clerk instance exists.
    #   Bot protection: https://challenges.cloudflare.com and https://*.protect.clerk.com
    #   (script-src, frame-src; connect-src needs the :* port wildcard).
    #   img-src https://img.clerk.com, worker-src 'self' blob:, style-src 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://img.clerk.com; font-src 'self' data:; connect-src 'self' https: https://*.clerk.accounts.dev https://*.clerk.com https://*.protect.clerk.com:*; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com; worker-src 'self' blob:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Remove server version fingerprinting
    server_tokens off;

    # ─── Health Check Endpoint ───────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # ─── Static Asset Caching ────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Gzip Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ─── SPA Routing ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Deny access to hidden files ─────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
